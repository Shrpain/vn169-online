name: Keep Render awake

on:
  schedule:
    # Render free spin down sau 15 phut inactivity. Ping moi 10 phut de giu awake.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Chua dat repo variable APP_URL."
            echo "Vao Settings > Secrets and variables > Actions > Variables > New repository variable"
            exit 0
          fi
          for i in 1 2 3; do
            if curl -fsS --max-time 25 "${APP_URL}/api/health"; then
              echo " OK"
              exit 0
            fi
            echo "Lan $i that bai, thu lai sau 20s..."
            sleep 20
          done
          echo "Khong ping duoc $APP_URL"
          exit 1
